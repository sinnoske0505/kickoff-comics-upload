name: 인스타 업로드
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 15분마다 확인 (깃허브 예약이 자주 밀려서 촘촘하게)
  workflow_dispatch:
    inputs:
      only_post:
        description: "바로 올릴 posts 폴더 이름 (비우면 예약된 것만)"
        required: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 게시
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          ONLY_POST: ${{ github.event.inputs.only_post }}
        run: python scripts/post.py
      - name: 게시 기록 저장
        if: always()
        run: |
          git config user.name "kickoff-bot"; git config user.email "bot@users.noreply.github.com"
          shopt -s nullglob
          for f in posts/*/posted.txt posts/*/error.txt; do git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "게시 기록"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
