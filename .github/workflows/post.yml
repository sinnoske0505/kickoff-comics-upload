name: 인스타 업로드
on:
  schedule:
    - cron: "7 * * * *"   # 매시 7분, 시간이 된 게시물 확인
  workflow_dispatch:
    inputs:
      only_post:
        description: "바로 올릴 posts 폴더 이름 (비우면 예약된 것만)"
        required: false
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 게시
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          ONLY_POST: ${{ github.event.inputs.only_post }}
        run: python scripts/post.py
      - name: 게시 기록 저장
        run: |
          git config user.name "kickoff-bot"; git config user.email "bot@users.noreply.github.com"
          git add posts/*/posted.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "게시 기록" && git push)
