name: 성과 분석
on:
  schedule:
    - cron: "37 9 * * *"   # 매일 18:37 KST (11/27 현승님: 반응 보고 전략 짜기)
  workflow_dispatch:
  # push:
    # paths: ["scripts/insights.py"]
permissions:
  contents: write
jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 인사이트 받기 (읽기 전용)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python scripts/insights.py
      - name: 결과 저장
        run: |
          git config user.name "kickoff-bot"; git config user.email "bot@users.noreply.github.com"
          git add insights/
          git diff --cached --quiet || (git commit -m "성과 분석" && git pull --rebase && git push)
