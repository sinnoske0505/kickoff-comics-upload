name: 연결 테스트
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 인스타 계정 확인 (게시 안 함)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          curl -s "https://graph.instagram.com/v23.0/me?fields=user_id,username,account_type&access_token=${IG_TOKEN}" | python3 -c "import sys,json;d=json.load(sys.stdin);print('계정:',d.get('username'),'| 유형:',d.get('account_type'),'| 오류:',d.get('error',{}).get('message','없음'))"
          curl -s "https://graph.instagram.com/v23.0/me/content_publishing_limit?access_token=${IG_TOKEN}" | python3 -c "import sys,json;print('게시 한도:',json.load(sys.stdin))"
